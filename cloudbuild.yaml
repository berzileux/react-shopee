steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/react-shopee', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/react-shopee']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - react-shopee
      - --image=gcr.io/$PROJECT_ID/react-shopee
      - --region=us-central1
      - --platform=managed

images:
  - 'gcr.io/$PROJECT_ID/react-shopee'

options:
  logging: CLOUD_LOGGING_ONLY